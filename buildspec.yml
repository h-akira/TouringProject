version: 0.2

# Deploys the whole backend: Agent first, then Backend.
#
# ⚠️ Lives at the REPOSITORY ROOT, which is where CodeBuild looks by default.
# The CloudFormation that creates the build project is in CICD/, but this file
# is not - if Agent/ and Backend/ are ever split into their own repositories,
# each one's buildspec is already where it needs to be.
#
# ⚠️ ONE CodeBuild runs both units, and the order is not arbitrary:
# the Agent publishes its runtime ARN to SSM, and the Backend's SAM template
# reads that parameter. Reversing them fails the first-ever deploy.
#
# Splitting these into two projects later is expected (they are separate units
# with separate regions). What makes that possible is that the handoff already
# goes through SSM rather than a shell variable - the split is then just a
# question of running Backend after Agent, not a redesign.
#
# App/ is deliberately absent: it ships through Expo, not AWS.

env:
  variables:
    AGENT_REGION: "us-east-1"
    BACKEND_REGION: "ap-northeast-1"
    # ⚠️ Pinned, not "latest". The agent is deployed by whatever version of
    # this CLI the build installs, so an unpinned install would silently move
    # CI onto a release nobody has run locally - and the CLI owns the CDK
    # code it generates. Bump this deliberately, after trying it by hand.
    #
    # The package is `@aws/agentcore`; it provides the `agentcore` binary.
    AGENTCORE_CLI_VERSION: "0.24.2"

phases:
  install:
    runtime-versions:
      python: 3.13
      nodejs: 20
    commands:
      - npm install -g aws-cdk "@aws/agentcore@${AGENTCORE_CLI_VERSION}"
      - pip install uv
      # Fail here rather than deep inside the deploy if the CLI is not usable.
      - agentcore --version

  pre_build:
    commands:
      # ⚠️ pytest is not present in the build image. It is only a test
      # dependency, so it lives in requirements-dev.txt rather than being
      # installed with the Lambda's code (the handlers import nothing beyond
      # the standard library and boto3, which the runtime already provides).
      - pip install -r Backend/requirements-dev.txt
      # ⚠️ Tests run BEFORE anything is deployed. A red test should stop the
      # release, not be discovered after the agent is already live.
      #
      # ⚠️ The cd is inside a subshell on purpose. CodeBuild runs every command
      # in the SAME shell, so a bare `cd` persists into the following commands
      # and silently changes where they run.
      - echo "--- Backend tests ---"
      - (cd Backend && python3 -m pytest tests/ -q)

  build:
    commands:
      # ---------- 1. Agent (us-east-1) ----------
      # aws-targets.json holds the account id and is gitignored, so CI writes
      # it from the identity it already runs as.
      - echo "--- Deploying Agent ---"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - |
        cat > Agent/agentcore/aws-targets.json <<EOF
        [
          {
            "name": "default",
            "account": "${ACCOUNT_ID}",
            "region": "${AGENT_REGION}"
          }
        ]
        EOF
      - (cd Agent && AWS_REGION=${AGENT_REGION} agentcore deploy -y)

      # ---------- 2. Publish the runtime ARN ----------
      # ⚠️ Written in TOKYO, because that is where the SAM stack reads it.
      # A CloudFormation export cannot be used: the AgentCore stack exports the
      # ARN in us-east-1, and ImportValue does not cross regions.
      # ⚠️ Selected BY NAME, not agentRuntimes[0]. The list has no guaranteed
      # order, so an index silently picks the wrong runtime the day a second
      # one exists - and the Backend would then be wired to it without any
      # error. The name is derived from agentcore.json (<project>_<runtime>),
      # so it cannot drift from what was just deployed.
      - |
        RUNTIME_NAME=$(python3 -c "import json; d=json.load(open('Agent/agentcore/agentcore.json')); print(f\"{d['name']}_{d['runtimes'][0]['name']}\")")
        echo "Looking up runtime: ${RUNTIME_NAME}"
        AGENT_ARN=$(aws bedrock-agentcore-control list-agent-runtimes \
          --region ${AGENT_REGION} \
          --query "agentRuntimes[?agentRuntimeName=='${RUNTIME_NAME}'].agentRuntimeArn | [0]" \
          --output text)
        if [ -z "$AGENT_ARN" ] || [ "$AGENT_ARN" = "None" ]; then
          echo "Runtime ${RUNTIME_NAME} not found after deploy - refusing to publish an empty ARN." >&2
          exit 1
        fi
        aws ssm put-parameter \
          --name "/trg/${ENV}/agent-runtime-arn" \
          --value "$AGENT_ARN" \
          --type String --overwrite \
          --region ${BACKEND_REGION}
      # ⚠️ Never echo the ARN: it contains the AWS account id, and build logs
      # are the easiest place to leak one.
      - echo "Agent runtime ARN published to SSM."

      # ---------- 3. Backend (Tokyo) ----------
      - echo "--- Deploying Backend ---"
      # ⚠️ Wrapped in a subshell like the others. This happens to be the last
      # command today, so a bare `cd` would not break anything yet - which is
      # exactly how the next command added below it ends up running in the
      # wrong directory.
      - |
        (
          cd Backend
          sam build
          # ⚠️ CAPABILITY_NAMED_IAM, not plain CAPABILITY_IAM: the template
          # creates an IAM role with an explicit RoleName (the one Transcribe
          # assumes to write transcripts), and CloudFormation refuses the whole
          # change set without it. Nothing local catches this - it fails at
          # deploy time only.
          sam deploy \
            --stack-name stack-trg-${ENV}-main \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides Environment=${ENV} AgentRuntimeArn=/trg/${ENV}/agent-runtime-arn \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${BACKEND_REGION}
        )

  post_build:
    commands:
      # ⚠️ The API key's VALUE is never printed - it is the only thing standing
      # between a Bedrock-billing endpoint and anyone who reads a build log.
      # Retrieve it with the command in Backend/README.md.
      - echo "Deploy complete (Agent + Backend)."
