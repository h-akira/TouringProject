AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CodeBuild project that deploys the touring app's backend - the AgentCore
  agent (us-east-1) and the SAM stack (Tokyo) - from a push to GitHub.

# Naming convention: <resource-type>-trg-<env>-<identifier>, matching
# Backend/template.yaml. "cicd" identifies these as pipeline resources.
Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Environment identifier, used in resource names and stack names.

  GitHubOwner:
    Type: String
    Default: h-akira
    Description: GitHub repository owner.

  GitHubRepo:
    Type: String
    Default: TouringProject
    Description: GitHub repository name.

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch that triggers a build.

  CodeStarConnectionArn:
    Type: String
    Description: >
      CodeStar/CodeConnections ARN for GitHub. Created and approved by hand in
      the console (see CICD/README.md) and passed at deploy time - it contains
      the AWS account id, which must never be committed to this public repo.

  EnableWebhook:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Build automatically when the branch is pushed.

  EnableNotification:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Send build results to the SNS topic from notice.yaml.

  NotificationEnv:
    Type: String
    Default: common
    Description: >
      Env identifier of the SNS topic stack. Separate from Env so one topic can
      serve every environment.

Conditions:
  IsWebhookEnabled: !Equals [!Ref EnableWebhook, "true"]
  IsNotificationEnabled: !Equals [!Ref EnableNotification, "true"]

Resources:
  CodeConnectionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "policy-trg-${Env}-cicd-connections"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - codeconnections:GetConnectionToken
              - codeconnections:GetConnection
              - codeconnections:UseConnection
              - codestar-connections:GetConnectionToken
              - codestar-connections:GetConnection
            Resource: !Ref CodeStarConnectionArn

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "role-trg-${Env}-cicd-codebuild"
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CodeConnectionsPolicy

  CloudWatchLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "policy-trg-${Env}-cicd-logs"
      Roles: [!Ref CodeBuildRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/codebuild-trg-${Env}-main"
              - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/codebuild-trg-${Env}-main:*"

  # ⚠️ Deliberately broad. This role deploys two IaC stacks (SAM and CDK) that
  # between them create Lambda, API Gateway, SQS, DynamoDB, IAM roles, S3
  # buckets, AgentCore runtimes and gateways. Enumerating every action those
  # need - and re-editing this policy whenever either stack grows a resource -
  # is not worth it for a single-developer project.
  #
  # What keeps this honest is that the role is assumable only by CodeBuild, and
  # the only thing CodeBuild runs is the buildspec in this repository.
  DeployPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "policy-trg-${Env}-cicd-deploy"
      Roles: [!Ref CodeBuildRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # CloudFormation drives both SAM and CDK.
          - Sid: CloudFormationDeploy
            Effect: Allow
            Action: cloudformation:*
            Resource: "*"
          # SAM --resolve-s3 and the CDK bootstrap bucket hold build artifacts.
          - Sid: ArtifactBuckets
            Effect: Allow
            Action: s3:*
            Resource:
              - arn:aws:s3:::aws-sam-cli-managed-*
              - arn:aws:s3:::aws-sam-cli-managed-*/*
              - arn:aws:s3:::cdk-*
              - arn:aws:s3:::cdk-*/*
              - !Sub "arn:aws:s3:::bedrock-agentcore-codebuild-sources-${AWS::AccountId}-*"
              - !Sub "arn:aws:s3:::bedrock-agentcore-codebuild-sources-${AWS::AccountId}-*/*"
          # ⚠️ The app's OWN bucket, which is not an artifact store: the Backend
          # stack creates it to hold recordings and synthesised answers. The
          # statement above cannot cover it - it is scoped by bucket name, and
          # none of those prefixes match - so without this the stack fails at
          # CREATE on the first deploy that includes it.
          - Sid: ApplicationBuckets
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub "arn:aws:s3:::s3-trg-${Env}-audio-${AWS::AccountId}"
              - !Sub "arn:aws:s3:::s3-trg-${Env}-audio-${AWS::AccountId}/*"
          # The application resources the two stacks manage.
          - Sid: ApplicationResources
            Effect: Allow
            Action:
              - lambda:*
              - apigateway:*
              - sqs:*
              - dynamodb:*
              - bedrock-agentcore:*
              - bedrock-agentcore-control:*
              - ecr:*
              - codebuild:*
              # The rule that delivers Transcribe's completion to the Lambda
              # that queues the question (docs/01_architecture.md section 7).
              - events:*
            Resource: "*"
          # SAM and CDK both create execution roles for what they deploy.
          - Sid: IAMDeploy
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:PassRole
              - iam:TagRole
              - iam:UntagRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListPolicyVersions
              - iam:CreateServiceLinkedRole
            Resource: "*"
          # ⚠️ The handoff between the two units. The Agent writes the runtime
          # ARN here (in Tokyo) and the SAM stack reads it - a CloudFormation
          # export cannot be used because the two stacks are in different
          # regions. Scoped to this project's own parameter path.
          - Sid: AgentArnHandoff
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:DeleteParameter
            Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/trg/*"
          # CDK bootstrap stores its version marker in SSM under /cdk-bootstrap.
          - Sid: CdkBootstrapParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:PutParameter
            Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/*"
          # CDK assumes its bootstrap roles to deploy.
          - Sid: CdkAssumeRoles
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/cdk-*"
          # The buildspec reads the account id to write aws-targets.json.
          - Sid: ReadOwnIdentity
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: "*"
          # Reverse-geocoding permissions are granted to the Lambda by SAM, but
          # the deployer needs to be able to describe them.
          - Sid: GeoPlaces
            Effect: Allow
            Action: geo-places:*
            Resource: "*"

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "codebuild-trg-${Env}-main"
      Description: Deploy the touring app's Agent and Backend.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        # ⚠️ MEDIUM rather than SMALL: the build installs the CDK and the
        # agentcore CLI through npm, which is slow on the smallest instance.
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENV
            Value: !Ref Env
      Source:
        Type: GITHUB
        Location: !Sub "https://github.com/${GitHubOwner}/${GitHubRepo}.git"
        # ⚠️ Repo root, not CICD/. That is where CodeBuild looks by default,
        # and it is where the file would already be if these units were ever
        # split into their own repositories.
        BuildSpec: buildspec.yml
      SourceVersion: !Sub "refs/heads/${GitHubBranch}"
      Triggers:
        Webhook: !If [IsWebhookEnabled, true, false]
        FilterGroups: !If
          - IsWebhookEnabled
          - - - Type: EVENT
                Pattern: PUSH
              - Type: HEAD_REF
                Pattern: !Sub "^refs/heads/${GitHubBranch}$"
              # ⚠️ There is deliberately NO FILE_PATH filter. Every push to the
              # branch deploys.
              #
              # A path filter looks like an easy way to skip documentation-only
              # pushes, but CodeBuild evaluates FILE_PATH against the push's
              # HEAD COMMIT alone. So a push whose last commit happens to touch
              # only docs is skipped entirely - taking any Backend or Agent
              # change earlier in the same push down with it, silently, with a
              # webhook delivery that reports 200 OK. Verified against a real
              # payload: a 12-commit push was skipped because its head commit
              # touched 6 documentation files.
              #
              # A build with nothing to deploy is cheap: CloudFormation and SAM
              # both no-op on an unchanged template. A deploy that silently does
              # not happen is not.
          - !Ref AWS::NoValue
      # The agent's CDK deploy is the slow part; 30 minutes is ample.
      TimeoutInMinutes: 30
      Tags:
        - Key: Project
          Value: TouringProject
        - Key: Env
          Value: !Ref Env

  BuildNotificationRule:
    Type: AWS::CodeStarNotifications::NotificationRule
    Condition: IsNotificationEnabled
    Properties:
      Name: !Sub "trg-${Env}-cicd-build-notification"
      DetailType: FULL
      Resource: !GetAtt CodeBuildProject.Arn
      EventTypeIds:
        - codebuild-project-build-state-succeeded
        - codebuild-project-build-state-failed
      Targets:
        - TargetType: SNS
          TargetAddress:
            Fn::ImportValue: !Sub "trg-${NotificationEnv}-cicd-notice-TopicArn"
      Tags:
        Project: TouringProject
        Env: !Ref Env

Outputs:
  CodeBuildProjectName:
    Description: Name of the CodeBuild project.
    Value: !Ref CodeBuildProject
    Export:
      Name: !Sub "${AWS::StackName}-ProjectName"
  ServiceRoleArn:
    Description: ARN of the role CodeBuild runs as.
    Value: !GetAtt CodeBuildRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ServiceRoleArn"
