AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SNS topic for CodeBuild notifications. Deployed separately from build.yaml so
  one topic can serve every environment.

Parameters:
  Env:
    Type: String
    Default: common
    Description: >
      Environment identifier. Defaults to "common" because a single topic
      serving dev and prod is usually what is wanted - there is only one person
      reading the mail.

Resources:
  # ⚠️ Subscriptions are NOT created here. An email subscription has to be
  # confirmed from the inbox, and a committed address would put a personal
  # email address in a public repository. Subscribe by hand - see CICD/README.md.
  NoticeTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "sns-trg-${Env}-cicd-notice"
      DisplayName: TouringProject CI/CD

  # CodeStar Notifications publishes to the topic on the service's behalf, so
  # the topic has to allow it explicitly - without this the notification rule
  # is created but silently never delivers.
  NoticeTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref NoticeTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCodeStarNotifications
            Effect: Allow
            Principal:
              Service: codestar-notifications.amazonaws.com
            Action: sns:Publish
            Resource: !Ref NoticeTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

Outputs:
  TopicArn:
    Description: ARN of the notification topic.
    Value: !Ref NoticeTopic
    Export:
      # build.yaml imports this by name, so the name is part of the contract.
      Name: !Sub "trg-${Env}-cicd-notice-TopicArn"
