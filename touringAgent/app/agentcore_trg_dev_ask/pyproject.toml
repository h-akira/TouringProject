[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcore_trg_dev_ask"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.15.0",
]
# `mcp` was dropped along with the scaffolded example MCP client: this stage
# measures conversation continuity, and an external tool server would only add
# noise. Add it back when tool use is on the agenda.

[tool.hatch.build.targets.wheel]
packages = ["."]
