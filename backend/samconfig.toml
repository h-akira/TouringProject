# SAM deploy configuration.
# Lets `sam deploy` run non-interactively (no --guided prompts each time).
# Naming convention: stack/resources use "<type>-trg-<env>-<identifier>".
version = 0.1

[default.global.parameters]
stack_name = "stack-trg-dev-main"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "stack-trg-dev-main"
region = "ap-northeast-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Pass the Environment parameter (used to build resource names).
parameter_overrides = "Environment=\"dev\""

# NOTE: Bedrock model availability differs by region. This mock does not use
# Bedrock, so ap-northeast-1 (Tokyo) is fine for now. Re-check the region when
# wiring Bedrock in a later stage (see docs/01_architecture.md).
