# SAM deploy configuration.
# Lets `sam deploy` run non-interactively (no --guided prompts each time).
# Naming convention: stack/resources use "<type>-trg-<env>-<identifier>".
version = 0.1

[default.global.parameters]
stack_name = "stack-trg-dev-main"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "stack-trg-dev-main"
region = "ap-northeast-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Only Environment is set here. AgentRuntimeArn is deliberately absent: it
# contains the AWS account id, which must never be committed to this public
# repo. Pass it on the command line instead - see backend/README.md:
#   sam deploy --parameter-overrides Environment=dev AgentRuntimeArn=<arn>
parameter_overrides = "Environment=\"dev\""

# NOTE: this stack stays in ap-northeast-1 (Tokyo), but the AgentCore runtime it
# calls lives in us-east-1 (the web-search connector is only offered there), so
# the Lambda targets that region explicitly. See docs/01_architecture.md 5.2.
