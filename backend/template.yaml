AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Touring AI voice app - backend. POST /ask resolves the rider's address and
  forwards the question to the AgentCore agent, which owns the conversation
  and web search; GET /health is a liveness check. Speech happens in the app
  (see pre-research/voice/), so this API takes text. API-key auth, usage
  plans, and cost controls come later (see docs/01_architecture.md).

# Naming convention: <resource-type>-trg-<env>-<identifier>
#   trg = touring, env = dev/prod, identifier = "main" for a single/primary
#   resource, otherwise a purpose name (e.g. "ask").
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment, used in resource names.

  AgentRuntimeArn:
    Type: String
    Description: >
      ARN of the AgentCore runtime to forward questions to. Passed at deploy
      time (see backend/README.md) so no account id is committed.

  AgentRegion:
    Type: String
    Default: us-east-1
    Description: >
      Region of the AgentCore runtime. Not this stack's region: the runtime is
      pinned to us-east-1 by the web-search connector (docs/01 section 6).

  AllowedIp:
    Type: String
    Default: ""
    Description: >
      Source IP (CIDR) allowed to call the API while it has no auth of its own.
      Passed at deploy time rather than committed - the address is not secret,
      but it says where the developer is, and this repository is public.

      ⚠️ Development only. Leave it empty for production: a rider's phone moves
      between networks constantly, so a pinned address would break the app.
      Production is meant to be protected by API keys instead (docs/01 §8),
      which are not built yet.

Conditions:
  # An empty AllowedIp means "no restriction", which is what production wants.
  RestrictByIp: !Not [!Equals [!Ref AllowedIp, ""]]

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.13

Resources:
  # API Gateway (single -> "main")
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "apigw-trg-${Environment}-main"
      StageName: Prod
      # ⚠️ The only thing standing between this API and anyone who learns its
      # URL. There is no auth yet, and every call spends money on Bedrock, so
      # while developing the API answers one address and nothing else.
      #
      # Both statements are needed. A lone Deny would leave nothing granting
      # access in the first place, and every request would be rejected.
      #
      # Passing an empty AllowedIp removes the restriction entirely - see the
      # parameter for why production has to do that.
      Auth:
        ResourcePolicy:
          CustomStatements: !If
            - RestrictByIp
            - - Effect: Allow
                Principal: "*"
                Action: execute-api:Invoke
                Resource: execute-api:/*
              - Effect: Deny
                Principal: "*"
                Action: execute-api:Invoke
                Resource: execute-api:/*
                Condition:
                  NotIpAddress:
                    aws:SourceIp: [!Ref AllowedIp]
            - !Ref AWS::NoValue

  # Single table for the whole app - see docs/03_dynamodb_table.md for why one
  # table holds every entity type, and how pk/sk distinguish them.
  #
  # AWS::DynamoDB::Table rather than SAM's SimpleTable: the latter takes only a
  # partition key, so it cannot express the sort key or the TTL this design
  # needs.
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "dynamodb-trg-${Environment}-main"
      # On-demand: a rider asks questions in bursts, so there is no sensible
      # capacity to provision.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # Answers can name places the rider has been, so they are not kept around
      # (docs/03_dynamodb_table.md section 4).
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Questions waiting to be answered. The queue is what takes the agent's
  # 10-25s out of the API Gateway request, which is capped at 29s.
  AskQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "sqs-trg-${Environment}-ask"
      # ⚠️ Must exceed the worker's own Timeout (120s), or SQS redelivers a
      # message that is still being processed - which would call the agent
      # twice and bill twice. See docs/03_dynamodb_table.md section 4.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AskDeadLetterQueue.Arn
        # Two retries, then park it. A question that failed three times will
        # not start working on the fourth.
        maxReceiveCount: 3

  # Failures land here instead of vanishing silently.
  AskDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "sqs-trg-${Environment}-ask-dlq"
      # Long enough to notice and investigate.
      MessageRetentionPeriod: 1209600 # 14 days

  # Lambda for the /ask endpoint (may grow -> purpose name "ask")
  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lambda-trg-${Environment}-ask"
      # <CodeUri>/<Handler>: src/handlers/ask.py -> handler()
      CodeUri: src/
      Handler: handlers/ask.handler
      # Only resolves the address and queues the question now, so it no longer
      # waits on the agent. Kept above the default because reverse-geocoding
      # plus a cold start still needs more than 10s.
      Timeout: 30
      Environment:
        Variables:
          # Amazon Location is called in this stack's own region.
          GEO_REGION: !Ref AWS::Region
          TABLE_NAME: !Ref MainTable
          QUEUE_URL: !Ref AskQueue
      Policies:
        # Reverse-geocoding the rider's position. geo-places has no per-resource
        # ARN to scope to, so the resource is "*" - the action itself is the
        # narrow part.
        - Statement:
            - Effect: Allow
              Action: geo-places:ReverseGeocode
              Resource: "*"
        - DynamoDBWritePolicy:
            TableName: !Ref MainTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AskQueue.QueueName
      Events:
        Ask:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /ask
            Method: post
            # NOTE: no auth yet. API-key auth + usage plan come in a later stage.

  # Where the waiting actually happens. Invoked from the queue rather than API
  # Gateway, so the agent's 10-25s no longer counts against the 29s ceiling.
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lambda-trg-${Environment}-worker"
      CodeUri: src/
      Handler: handlers/worker.handler
      # Well clear of the 25.5s worst case measured so far, and deliberately
      # below the queue's 180s visibility timeout.
      Timeout: 120
      Environment:
        Variables:
          AGENT_ARN: !Ref AgentRuntimeArn
          AGENT_REGION: !Ref AgentRegion
          TABLE_NAME: !Ref MainTable
      Policies:
        # Without this the call comes back as AccessDenied. Scoped to the one
        # runtime; the wildcard suffix covers its /runtime-endpoint/* children,
        # which is what invoke_agent_runtime actually targets.
        - Statement:
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !Ref AgentRuntimeArn
                - !Sub "${AgentRuntimeArn}/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        AskQueued:
          Type: SQS
          Properties:
            Queue: !GetAtt AskQueue.Arn
            # ⚠️ One question per invocation. The default of 10 would put
            # 10 x ~25s of agent calls inside one 120s timeout.
            BatchSize: 1

  # What the app polls while it waits. Reads the table; never calls the agent.
  ResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lambda-trg-${Environment}-result"
      CodeUri: src/
      Handler: handlers/result.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref MainTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        Result:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /ask/{requestId}
            Method: get

  # Lambda for the /health endpoint (liveness check)
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "lambda-trg-${Environment}-health"
      CodeUri: src/
      Handler: handlers/health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /health
            Method: get

Outputs:
  ApiBaseUrl:
    Description: "Base URL of the API (append /ask)"
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
