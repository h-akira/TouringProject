openapi: 3.0.3
info:
  title: Touring AI voice app - API
  version: 0.1.0
  description: >
    App <-> backend contract for the touring AI voice app.
    This is the source of truth for request/response shapes (used for the
    frontend fetch types and as documentation). It is kept as a standalone
    spec for now; it is NOT yet wired into API Gateway's DefinitionBody.
    Wiring it in (for request validation) can come later once the shape is
    stable. See 01_architecture.md.

servers:
  # The base URL is environment-specific and injected in the app via
  # EXPO_PUBLIC_API_BASE_URL (see app/.env.example). Not hardcoded here.
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/Prod
    description: Deployed stage (values differ per environment)
    variables:
      apiId:
        default: your-api-id
      region:
        default: ap-northeast-1

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      description: >
        Lightweight liveness/health check. No auth, no parameters. Useful for
        verifying the app <-> backend wiring and for monitoring, independent of
        the main /ask logic.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ask:
    post:
      operationId: ask
      summary: Ask the AI about the current location
      description: >
        Send a question together with the current location and get the answer
        back. The Lambda forwards this to the AgentCore runtime, which handles
        the conversation history and web search.

        Pass the same `sessionId` on later requests to continue the
        conversation (US-1.02). Voice (STT/TTS) and API-key auth come later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Answer generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          description: >
            Invalid request: malformed body, missing/empty `question`, a
            question over the length limit, or a `sessionId` shorter than 33
            characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The agent could not be reached or returned no answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    Coordinates:
      type: object
      description: A GPS point.
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: 35.0
        longitude:
          type: number
          format: double
          example: 139.0

    AskRequest:
      type: object
      description: >
        Request body for POST /ask.

        `start` is the rider's current location, and the point the address is
        resolved from. `end` is an EARLIER position, used to derive the
        direction of travel: the rider is travelling away from `end` towards
        `start`. It stays optional - the server simply omits the heading when
        it is missing, or when the two points are within a few metres of each
        other (a rider stopped at a light, where the bearing would be GPS
        noise).
      required: [question, start]
      properties:
        question:
          type: string
          description: The rider's question, as text.
          minLength: 1
          maxLength: 500
          example: 右手に見える山は何ですか？
        sessionId:
          type: string
          description: >
            Conversation id. Omit it to start a new conversation - the server
            mints one and returns it. Send that value back to continue the
            conversation. The app's job is to store it, not to generate it.
            (At least 33 characters, an AgentCore requirement.)
          minLength: 33
          maxLength: 128
          example: touring-0123456789abcdef0123456789abcdef
        start:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: The rider's current position.
        end:
          allOf:
            - $ref: "#/components/schemas/Coordinates"
          description: >
            An earlier position, for the direction of travel (US-2.03). The app
            picks it by walking back through its recent fixes for the newest
            one far enough away to give a meaningful bearing, and omits it
            entirely when there is none - while stopped, or just after a turn,
            where a heading would be stale or change second to second.
        elapsedSeconds:
          type: integer
          format: int32
          minimum: 0
          description: >
            Seconds since the first question of this conversation. Lets the
            agent tell how much the rider has moved between turns, so it can
            resolve "that mountain" against the position it was asked at rather
            than the current one. Omit on the first question of a conversation.
          example: 180
        # FUTURE: audio of the question (format/upload method TBD; large audio
        # may go via S3 rather than inline). See 01_architecture.md §9.

    AskResponse:
      type: object
      description: Response body for POST /ask.
      required: [answer, sessionId]
      properties:
        answer:
          type: string
          description: The answer to read back to the rider.
          example: それはたぶん富士山です。標高は3776メートルあります。
        sessionId:
          type: string
          description: >
            The conversation id this answer belongs to. Echoed back so the app
            can store it and continue the conversation on the next request
            (it is the server that generates one when the app sends none).
          example: touring-0123456789abcdef0123456789abcdef
        # FUTURE: audio answer (Polly). Either audio bytes or an S3 URL.
        # See 01_architecture.md §9.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Health status.
          example: ok
